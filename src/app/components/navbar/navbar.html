<header

  id="top-nav">
  <nav class="flex justify-between items-center px-gutter py-4 w-full max-w-container-max mx-auto">
    <div class="flex items-center gap-2">
      <span class="font-headline-md text-headline-md text-primary tracking-tight">The Gilded Petal</span>
    </div>
    <ul class="hidden md:flex gap-8 font-label-lg text-label-lg uppercase">
      <li><a class="text-primary font-bold border-b-2 border-primary pb-1" href="#">Home</a></li>
      <li><a class="text-on-surface-variant hover:text-primary transition-colors" href="#menu">Menu</a></li>

    onclick="toggleMobileNav()">close</button>
  <a class="font-headline-md text-primary" href="#" onclick="toggleMobileNav()">Home</a>
  <a class="font-headline-md text-on-surface-variant" href="#menu" onclick="toggleMobileNav()">Menu</a>
  <a class="font-headline-md text-on-surface-variant" href="#about" onclick="toggleMobileNav()">About</a>
  <a class="font-headline-md text-on-surface-variant" href="#location" onclick="toggleMobileNav()">Location</a>
